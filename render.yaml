services:
  - type: web
    name: app-frontend
    env: node
    rootDir: frontend
    buildCommand: "yarn install && yarn build"
    startCommand: "yarn start"
    staticPublishPath: build

  - type: web
    name: app-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
